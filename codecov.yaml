codecov:
  # # Ensures coverage is only uploaded if CI passes (e.g., tests succeed).
  require_ci_to_pass: true

coverage:
  # Rounds coverage to 2 decimal places (e.g., 85.43%).
  precision: 2
  # Rounds down for conservative estimates.
  round: down
  # Below 60% is red, 60-95% is the gradient, above 95% is green.
  # Calibrated against the project's real ex-mocks coverage of roughly 80%.
  range: "60...95"

  status:
    # Overall project coverage.
    project:
      default:
        # Aim for 75% coverage across the project. Real coverage excluding the
        # generated mocks (ignored below) is roughly 80%, so this leaves a small
        # margin rather than enough headroom to absorb a large regression.
        target: 75%
        # Allow 5% drop due to uncovered new code before failing.
        threshold: 5%
        # Compare against the base branch (e.g., main).
        base: auto
        # Apply to these branches.
        branches:
          - main
        # Fail if CI fails.
        if_ci_failed: error

    # Coverage for new code in PRs.
    patch:
      default:
        # Require 80% of new/changed code in PRs to be covered.
        target: 80%
        # Allow 5% uncovered new code before failing.
        threshold: 5%
        # Only apply to pull requests.
        only_pulls: true

    # Detect unexpected coverage changes outside the PR diff.
    changes:
      default:
        enabled: true

comment:
  # Customize PR comment layout.
  layout: "reach, diff, files"
  # Post comment on PRs with coverage info.
  behavior: default
  # Only comment if coverage changes.
  require_changes: true

parsers:
  # For Go projects using `go test -cover` + `gocov`.
  gcov:
    branch_detection:
      # Detect branch coverage if available.
      conditional: yes
      # Include loops in branch detection.
      loop: yes
      # Exclude method-level granularity.
      method: no
      # Exclude macros.
      macro: no

# Exclude files/directories from coverage.
ignore:
  # Ignore all mocks subdirectories. The generated Mockery doubles are excluded
  # because they are never exercised directly, which is what inflates the raw
  # `go tool cover` total to ~54% while the real figure is ~80%.
  - "**/mocks/*"
